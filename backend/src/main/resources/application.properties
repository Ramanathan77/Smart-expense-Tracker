spring.application.name=demo
server.port=${PORT:8081}

# Database Configuration (Auto-detects H2 or MySQL based on SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:spendora;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Allowed CORS origins
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Security Settings
jwt.secret=${JWT_SECRET:spendora_super_secret_key_that_must_be_very_long_for_hmac_sha_512}
jwt.expiration=86400000

# Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect